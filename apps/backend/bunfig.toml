[install]
# Do not resolve package versions published less than seven days ago; see CONTRIBUTING.md,
# "Dependencies". `trustedDependencies` is empty, so no package runs install scripts.
minimumReleaseAge = 604800

[test]
# Runs before any test file / module loads — see src/test-preload.ts for why
# env must be in place before env-derived singletons (@/config) are imported.
preload = ["./src/test-preload.ts"]

[package]
name = "nuphos-cli"
version = "0.15.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
publish = false
description = "Terminal client for Nuphos agent conversations"

[[bin]]
name = "nuphos"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
open = "5"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# The session token lives in the OS credential store, where the desktop app reads it too:
# the login keychain on macOS, Credential Manager on Windows, the Secret Service on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

# Pure Rust D-Bus, so the static musl build needs no libdbus.
[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

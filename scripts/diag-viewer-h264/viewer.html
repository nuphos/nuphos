<!doctype html><html><body style="margin:0;background:#fff">
<div id="host" style="position:absolute;inset:0;display:flex"></div>

      d.configure({ codec, codedWidth: W, codedHeight: H, optimizeForLatency: true, hardwareAcceleration: hw })
      d.decode(new EncodedVideoChunk({ type: 'key', timestamp: 0, data: frames[0].subarray(16) }))

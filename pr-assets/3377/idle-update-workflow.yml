# One-off: a packaged macOS Desktop with a staged update installs it while idle.
name: End-to-end
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  idle-update:
    name: A staged update installs while the Mac is idle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Make a throwaway code-signing identity
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          cat > cert.conf <<'CONF'
          [req]
          distinguished_name = dn
          x509_extensions = ext
          prompt = no
          [dn]
          CN = Nuphos E2E
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CONF
          sed -i '' 's/^          //' cert.conf
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config cert.conf -keyout key.pem -out cert.pem
          /usr/bin/openssl pkcs12 -export -inkey key.pem -in cert.pem -name "Nuphos E2E" -out id.p12 -passout pass:e2e
          security create-keychain -p e2e "$RUNNER_TEMP/e2e.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/e2e.keychain-db"
          security unlock-keychain -p e2e "$RUNNER_TEMP/e2e.keychain-db"
          security import id.p12 -k "$RUNNER_TEMP/e2e.keychain-db" -P e2e -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k e2e "$RUNNER_TEMP/e2e.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/e2e.keychain-db" $(security list-keychains -d user | tr -d '"')
          sw_vers
          sudo security authorizationdb write com.apple.trust-settings.admin allow || true
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem || true
          security find-identity -p codesigning
          security find-identity -v -p codesigning | grep "Nuphos E2E"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # macos-15's default Xcode cannot compile mac-screen-host.swift; main's CI builds on Xcode 26.
      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version && xcrun swiftc --version
      - name: Stage the local agent adapter
        working-directory: apps/desktop
        # The screen-sharing helper needs macOS 26's compiler, and macOS 26 will not trust a
        # throwaway certificate. Updating does not use the helper, so this run ships a stand-in.
        run: |
          echo 'print("stand-in for the screen-sharing helper in the idle-update run")' > local-runtime/mac-screen-host.swift
          node local-runtime/prepare.mjs --targets darwin-$ARCH --no-openab
      - name: Build 0.200.0 and 0.200.1, updating from a feed on this computer
        working-directory: apps/desktop
        env:
          CSC_KEYCHAIN: ${{ runner.temp }}/e2e.keychain-db
        run: |
          set -euxo pipefail
          pnpm exec vite build
          for version in 0.200.0 0.200.1; do
            VERSION=$version OUT="$RUNNER_TEMP/build-$version" node -e '
              const fs = require("fs")
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
              pkg.version = process.env.VERSION
              pkg.build.directories.output = process.env.OUT
              pkg.build.publish = { provider: "generic", url: "http://127.0.0.1:8765" }
              pkg.build.mac.target = [{ target: "zip", arch: [process.env.ARCH] }]
              pkg.build.mac.notarize = false
              pkg.build.mac.identity = "Nuphos E2E"
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2))'
            pnpm exec electron-builder --mac --$ARCH --publish never
            ls -la "$RUNNER_TEMP/build-$version"
          done
          cat "$RUNNER_TEMP/build-0.200.1/latest-mac.yml"
          codesign -dvv "$RUNNER_TEMP"/build-0.200.1/mac*/Nuphos.app 2>&1 | head -20
      - name: An idle Mac installs the staged update by itself; one that turned it off does not
        run: bash "$GITHUB_WORKSPACE/.github/idle-update-e2e.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: idle-update-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence

name: Changed apps
description: Which apps a pull request or merge group changes. Used by ci.yml's changes job and by the jobs that check for themselves.
outputs:
  backend:
    value: ${{ steps.filter.outputs.backend == 'true' && steps.bump.outputs.version_only != 'true' }}
  desktop:
    value: ${{ steps.filter.outputs.desktop == 'true' && steps.bump.outputs.version_only != 'true' }}
  desktop_package:
    value: ${{ steps.filter.outputs.desktop_package }}
  ios:
    value: ${{ steps.filter.outputs.ios == 'true' && steps.bump.outputs.version_only != 'true' }}
  cli:
    value: ${{ steps.filter.outputs.cli }}
  openab:
    value: ${{ steps.filter.outputs.openab }}
  skill_install:
    value: ${{ steps.filter.outputs.skill_install }}
  dev_scripts:
    value: ${{ steps.filter.outputs.dev_scripts }}
  lint_config:
    value: ${{ steps.filter.outputs.lint_config == 'true' && steps.bump.outputs.version_only != 'true' }}
  import_cycles:
    value: ${{ steps.filter.outputs.import_cycles }}
  e2e:
    value: ${{ steps.filter.outputs.e2e == 'true' && steps.bump.outputs.version_only != 'true' }}
runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      id: filter
      with:
        filters: |
          # Backend tests import electron main's local runtime, so its typecheck follows it,
          # and from there the desktop's shared types and one runtime-image script.
          backend:
            - 'apps/backend/**'
            - 'apps/desktop/electron/**'
            - 'apps/desktop/src/api/**'
            - 'apps/desktop/src/types/**'
            - 'apps/runtime/image/antigravity-status.mjs'
            - '.bun-version'
            - '.github/workflows/ci.yml'
          # electron main imports runtime-file-program.ts from the backend.
          desktop:
            - 'apps/desktop/**'
            - 'apps/backend/src/lib/claude-code-preview/runtime-file-program.ts'
            # The local runtime bundles most of the runtime image (apps/runtime/README.md).
            - 'apps/runtime/image/**'
            - '.github/workflows/ci.yml'
          # What a PR needs the Mac for: what electron-builder adds beyond the
          # vite bundle, and the macOS-only native addon. The single `*` takes
          # the top-level config: package.json (electron-builder's config) and
          # the lockfile.
          desktop_package:
            - 'apps/desktop/*'
            - 'apps/desktop/native/**'
            - 'apps/backend/src/lib/claude-code-preview/runtime-file-program.ts'
            - 'apps/runtime/image/**'
            - 'apps/desktop/electron/**'
            - 'apps/desktop/local-runtime/**'
            - 'apps/desktop/build/**'
            - 'apps/desktop/scripts/**'
            - 'apps/desktop/patches/**'
            - '.github/workflows/ci.yml'
          ios:
            - 'apps/ios/**'
            - '.github/workflows/ci.yml'
          cli:
            - 'apps/cli/**'
            - '.github/workflows/ci.yml'
          openab:
            - 'apps/runtime/openab/**'
            - '.github/workflows/ci.yml'
          skill_install:
            - 'apps/backend/src/lib/agent/builtin-skills/skills/*/scripts/install.sh'
            - 'apps/backend/src/lib/agent/builtin-skills/github-install.test.sh'
            - '.github/workflows/ci.yml'
          dev_scripts:
            - 'scripts/**'
            - '.github/workflows/release-*.yml'
            - 'eslint.config.mjs'
            - 'eslint-rules/**'
            - '.claude/hooks/**'
            - '.github/workflows/ci.yml'
          lint_config:
            - 'eslint.config.mjs'
            - 'eslint-rules/**'
            - 'apps/*/eslint.config.*'
            - 'scripts/check-lint-config-integrity.mjs'
            - 'scripts/check-lint-config-integrity.test.mjs'
            # A plugin bump is how a live rule turns into a deprecated stub.
            - 'package.json'
            - 'bun.lock'
            - 'apps/*/package.json'
            - 'apps/*/bun.lock'
            - 'apps/desktop/pnpm-lock.yaml'
            - '.github/workflows/ci.yml'
          import_cycles:
            - 'apps/backend/src/**'
            - 'apps/desktop/src/**'
            - 'apps/desktop/electron/**'
            - 'apps/*/tsconfig*.json'
            - 'scripts/check-import-cycles.mjs'
            - 'scripts/check-import-cycles.test.mjs'
            - 'scripts/import-cycles.baseline.json'
            - '.github/workflows/ci.yml'
          # What `bun run e2e` starts: the backend, the Desktop app and OpenAB.
          e2e:
            - 'apps/desktop/**'
            - 'apps/backend/**'
            - 'apps/runtime/openab/**'
            - 'scripts/e2e/**'
            - 'package.json'
            - 'bun.lock'
            - '.github/workflows/ci.yml'

    # A release PR changes only `version` fields, the App Store notes and the
    # runtime's SDK pins. No job here reads a version: Electron and the
    # release workflows do, at run or tag time. So such a diff skips the
    # backend, desktop, iOS and lint-config jobs. The CLI job still runs on
    # its Cargo bump (its build is `--locked`), and Runtime CI builds the
    # images for the pins. Anything else in the diff runs everything.
    - name: Detect a version-only diff
      id: bump
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      run: |
        git fetch --no-tags --depth=1 origin "$BASE"
        # A failed diff or jq must fail the step or answer false, never true.
        git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed"
        only=true
        while read -r f; do
          case "$f" in
            apps/cli/* | apps/runtime/* | apps/ios/whats-new.txt) ;;
            apps/*/package.json)
              old=$(git show "$BASE:$f" | jq -S 'del(.version)') &&
                new=$(jq -S 'del(.version)' "$f") &&
                [ "$old" = "$new" ] || only=false ;;
            *) only=false ;;
          esac
        done < "$RUNNER_TEMP/changed"
        echo "version_only=$only" | tee -a "$GITHUB_OUTPUT"

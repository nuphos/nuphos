# actionlint only knows GitHub-hosted runner labels, so every job in this repo —
# which runs on self-hosted runners — otherwise lints as "unknown label".
# Declaring them here is what makes `actionlint .github/workflows/*.yml` usable
# at all, whether run locally or by a review bot. Derived from the labels
# actually in use:
#   rg -o 'runs-on: [a-z0-9-]+' .github/workflows/*.yml | sort -u
self-hosted-runner:
  labels:
    - instabox-medium
    - nuphos-m1
    - xcode-27

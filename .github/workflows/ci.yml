name: CI

on:
  pull_request:
  merge_group:
  # Format and lint only, so a regression two merged PRs create together shows on main.
  push:
    branches: [main]
  # Runs only the end-to-end job, on any branch: for evidence a pull request cannot carry.
  workflow_dispatch:
    inputs:
      real_disk:
        description: Run the isolated real-disk Desktop evidence scenario
        type: boolean
        default: false
  # The full macOS package every night, since PRs and the queue build it only
  # when a packaging input changes.
  schedule:
    - cron: '0 19 * * *'

# Merge-group refs (gh-readonly-queue/main/pr-N-<sha>) are unique per group, so
# queued runs never cancel each other; a PR's new push still cancels its old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Most Linux jobs run on instabox-medium (amd64, outside the hosted-runner concurrency
# limit). Only this repository's own code runs there; a fork's pull request stays
# on GitHub's hosts.
jobs:
  # Every PR in a merge group already passed format on pull_request, so the merge
  # queue skips it (a skipped job still satisfies its required check); it runs
  # again on main after each merge. Lint stays in the queue: two PRs can push a
  # file past max-lines only together, and that must not reach main.
  format:
    name: Format (prettier --check)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check

  # Keep the job name stable: it is meant to become a required check. A merge
  # group only holds PRs whose commits already passed this on pull_request, so
  # it reports success there instead of blocking the queue.
  dco:
    name: DCO
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Skip in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Sign-offs were checked on the pull request."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Run the base branch's checker so a PR cannot loosen its own check;
        # the PR's copy is used only until the base has one.
        run: |
          git show "$BASE:scripts/check-dco.sh" > "$RUNNER_TEMP/check-dco.sh" 2>/dev/null ||
            cp scripts/check-dco.sh "$RUNNER_TEMP/check-dco.sh"
          bash "$RUNNER_TEMP/check-dco.sh" "$BASE" "$HEAD"

  changes:
    name: Detect changed apps
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    outputs:
      # A version-only diff (a release PR) skips these; see the step below.
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.bump.outputs.version_only != 'true' }}
      desktop: ${{ steps.filter.outputs.desktop == 'true' && steps.bump.outputs.version_only != 'true' }}
      desktop_package: ${{ steps.filter.outputs.desktop_package }}
      ios: ${{ steps.filter.outputs.ios == 'true' && steps.bump.outputs.version_only != 'true' }}
      cli: ${{ steps.filter.outputs.cli }}
      openab: ${{ steps.filter.outputs.openab }}
      skill_install: ${{ steps.filter.outputs.skill_install }}
      dev_scripts: ${{ steps.filter.outputs.dev_scripts }}
      lint_config: ${{ steps.filter.outputs.lint_config == 'true' && steps.bump.outputs.version_only != 'true' }}
      import_cycles: ${{ steps.filter.outputs.import_cycles }}
      e2e: ${{ steps.filter.outputs.e2e == 'true' && steps.bump.outputs.version_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # A merge group is judged by all it adds to main, not by its own PR: its base_sha is
          # the group ahead's head, so a group touching only iOS skipped Backend lint and, as
          # the queue's green head, merged the failing groups ahead of it.
          base: ${{ github.event.merge_group.base_ref }}
          filters: |
            # Backend tests import electron main's local runtime, so its typecheck follows it,
            # and from there the desktop's shared types and one runtime-image script.
            backend:
              - 'apps/backend/**'
              - 'apps/desktop/electron/**'
              - 'apps/desktop/src/api/**'
              - 'apps/desktop/src/types/**'
              - 'apps/runtime/image/antigravity-status.mjs'
              - '.bun-version'
              - '.github/workflows/ci.yml'
            # electron main imports these program texts from the backend.
            desktop:
              - 'apps/desktop/**'
              - 'apps/backend/src/lib/claude-code-preview/runtime-file-program.ts'
              - 'apps/backend/src/lib/claude-code-preview/runtime-quota-grok-billing.ts'
              # The local runtime bundles most of the runtime image (apps/runtime/README.md).
              - 'apps/runtime/image/**'
              - '.github/workflows/ci.yml'
            # What a PR needs the Mac for: what electron-builder adds beyond the
            # vite bundle, and the macOS-only native addon. The single `*` takes
            # the top-level config: package.json (electron-builder's config) and
            # the lockfile.
            desktop_package:
              - 'apps/desktop/*'
              - 'apps/desktop/native/**'
              - 'apps/backend/src/lib/claude-code-preview/runtime-file-program.ts'
              - 'apps/backend/src/lib/claude-code-preview/runtime-quota-grok-billing.ts'
              - 'apps/runtime/image/**'
              - 'apps/desktop/electron/**'
              - 'apps/desktop/local-runtime/**'
              - 'apps/desktop/build/**'
              - 'apps/desktop/scripts/**'
              - 'apps/desktop/patches/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'apps/ios/**'
              - '.github/workflows/ci.yml'
            cli:
              - 'apps/cli/**'
              - '.github/workflows/ci.yml'
            openab:
              - 'apps/runtime/openab/**'
              - '.github/workflows/ci.yml'
            skill_install:
              - 'apps/backend/src/lib/agent/builtin-skills/skills/*/scripts/install.sh'
              - 'apps/backend/src/lib/agent/builtin-skills/github-install.test.sh'
              - '.github/workflows/ci.yml'
            dev_scripts:
              - 'scripts/**'
              - '.github/workflows/release-*.yml'
              - 'eslint.config.mjs'
              - 'eslint-rules/**'
              - '.claude/hooks/**'
              - '.github/workflows/ci.yml'
            lint_config:
              - 'eslint.config.mjs'
              - 'eslint-rules/**'
              - 'apps/*/eslint.config.*'
              - 'scripts/check-lint-config-integrity.mjs'
              - 'scripts/check-lint-config-integrity.test.mjs'
              # A plugin bump is how a live rule turns into a deprecated stub.
              - 'package.json'
              - 'bun.lock'
              - 'apps/*/package.json'
              - 'apps/*/bun.lock'
              - 'apps/desktop/pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            import_cycles:
              - 'apps/backend/src/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/electron/**'
              - 'apps/*/tsconfig*.json'
              - 'scripts/check-import-cycles.mjs'
              - 'scripts/check-import-cycles.test.mjs'
              - 'scripts/import-cycles.baseline.json'
              - '.github/workflows/ci.yml'
            # What `bun run e2e` starts: the backend, the Desktop app and OpenAB.
            e2e:
              - 'apps/desktop/**'
              - 'apps/backend/**'
              - 'apps/runtime/openab/**'
              - 'scripts/e2e/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

      # A release PR changes only `version` fields, the App Store notes and the
      # runtime's SDK pins. No job here reads a version: Electron and the
      # release workflows do, at run or tag time. So such a diff skips the
      # backend, desktop, iOS and lint-config jobs. The CLI job still runs on
      # its Cargo bump (its build is `--locked`), and Runtime CI builds the
      # images for the pins. Anything else in the diff runs everything.
      - name: Detect a version-only diff
        id: bump
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          # A failed diff or jq must fail the step or answer false, never true.
          git diff --no-renames --name-only FETCH_HEAD HEAD > "$RUNNER_TEMP/changed"
          only=true
          while read -r f; do
            case "$f" in
              apps/cli/* | apps/runtime/* | apps/ios/whats-new.txt) ;;
              apps/*/package.json)
                old=$(git show "FETCH_HEAD:$f" | jq -S 'del(.version)') &&
                  new=$(jq -S 'del(.version)' "$f") &&
                  [ "$old" = "$new" ] || only=false ;;
              *) only=false ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "version_only=$only" | tee -a "$GITHUB_OUTPUT"

  ios:
    name: iOS (simulator build)
    needs: changes
    # Each PR in the merge queue already passed this; a Mac is too scarce to build it twice.
    if: github.event_name != 'merge_group' && needs.changes.outputs.ios == 'true'
    # Same-repo pull requests use the maintainers' Mac (label nuphos-m1), which has
    # only Xcode 27.2; everything else keeps the hosted Xcode release-ios.yml uses.
    # A fork's pull request never reaches that Mac: its job-started hook refuses it too.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "nuphos-m1"]') || 'xcode-27' }}
    env:
      DEVELOPER_DIR: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && '/Applications/Xcode.app/Contents/Developer' || '/Applications/Xcode_27.1.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test runtime observations
        run: bash apps/ios/tests/run.sh
      - name: Build for iOS Simulator
        working-directory: apps/ios
        run: |
          set -euo pipefail
          xcodebuild -project nuphos-ios.xcodeproj -scheme nuphos-ios -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
      # A string added in code without a catalog entry would ship untranslated.
      - name: Check that the string catalog matches the code
        working-directory: apps/ios
        run: |
          bash tests/sync-strings.sh build
          git diff --exit-code Shared/Localizable.xcstrings

  cli:
    name: CLI (fmt + clippy + test)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    # The image ships rustup and a stable toolchain.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          sh install.test.sh
      # The release builds this target; catch a break before a tag does.
      - name: Static Linux build
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl

  cli-macos:
    name: CLI (macOS clippy + test)
    needs: changes
    # Not in the merge queue: each PR already passed it, and macOS runners are scarce.
    if: github.event_name != 'merge_group' && needs.changes.outputs.cli == 'true'
    # The keychain code (src/secret.rs) compiles only on macOS.
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test install.sh
        run: sh install.test.sh
      # The CLI binary, to try a pull request's CLI on a Mac. cargo test builds only the test binaries.
      - name: Build
        run: cargo build --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuphos-cli-macos-arm64
          path: apps/cli/target/debug/nuphos
          retention-days: 7
          if-no-files-found: error

  skill-install:
    name: Skill installers (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.skill_install == 'true'
    # Local runtimes run these scripts on macOS, the managed image on Linux.
    strategy:
      matrix:
        # The merge queue drops macOS: each PR already passed it, and macOS runners are scarce.
        os: ${{ github.event_name == 'merge_group' && fromJSON('["ubuntu-24.04-arm"]') || fromJSON('["ubuntu-24.04-arm", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the github skill's install.sh
        run: bash apps/backend/src/lib/agent/builtin-skills/github-install.test.sh

  openab:
    name: openab (clippy + test)
    needs: changes
    if: needs.changes.outputs.openab == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: apps/runtime/openab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain the Desktop and CLI releases build openab with (prepare.mjs).
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Clippy
        run: cargo +1.99.0 clippy --locked --workspace --features unified -- -D warnings
      - name: Test
        run: cargo +1.99.0 test --locked --workspace
      # A gateway adapter without the root acp feature must still build (#3049).
      - name: Check without acp
        run: cargo +1.99.0 check --locked --features telegram

  backend:
    name: Backend (typecheck + test + docker build)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-latest' }}
    # The runtime-state store's compare-and-set is a Lua script; its suite runs
    # only against a real Redis (TEST_REDIS_URL below).
    services:
      redis:
        image: redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # For the `*.mongo.test.ts` suites, which check what the database itself does
      # with a document. Same image and rseq setting as deploy/compose.
      mongo:
        image: mongo:8.0.32
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Tests must run on the Bun the production image ships, or a runtime
      # behavior change (e.g. http.Agent options) can pass CI and fail in prod.
      - name: Bun matches the backend image
        run: |
          image=$(sed -n 's|^FROM oven/bun:\([0-9.]*\).*|\1|p' apps/backend/Dockerfile | sort -u)
          test "$image" = "$(bun --version)" || { echo "::error::.bun-version Bun $(bun --version) != Dockerfile Bun $image"; exit 1; }
      - name: Install dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: apps/backend
        # tsc needs between 2 and 3 GB on this project; node's default heap on
        # this runner is ~2 GB, so it OOMs (exit 134) with no type error to show.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run typecheck
      # Lint runs in its own job (backend-lint) so it overlaps these steps.
      - name: Unit tests
        working-directory: apps/backend
        # `mock.module` registrations are process-wide, so two suites mocking the
        # same module can answer each other's code: a turn one suite starts is
        # recorded into another's array and the first sees nothing. It only ever
        # reproduces on this runner, and both in-test remedies were tried and
        # reshuffled the failures rather than fixing them.
        #
        # Until the code under test takes its collaborators by injection, every
        # suite that mocks a contended module gets its own process. The set is
        # DERIVED, not hand-kept: a new suite that mocks one of these is isolated
        # automatically, which is what the previous hard-coded list could not do —
        # it let a new file silently join the shared process and break an
        # unrelated suite.
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          CONTENDED='@/routes/agent|@/lib/identity|@/lib/agent/db|@/models|@/lib/slack/api|@/lib/slack/agent-bot|@/middleware/auth'
          # A suite that loads the whole app binds every route module's
          # middleware at once, so it is isolated too.
          # The *.mongo.test.ts suites run in the next step, against the database.
          isolated=$(grep -rlE "mock\.module\('($CONTENDED)'|import\('@/index-app'\)" src --include='*.test.ts' --exclude='*.mongo.test.ts' | sort)
          shared=$(find src -name '*.test.ts' ! -name '*.mongo.test.ts' | sort | comm -23 - <(echo "$isolated"))
          echo "isolated suites:"; echo "$isolated" | sed 's/^/  /'
          bun test $shared
          for suite in $isolated; do
            echo "::group::$suite"
            bun test "$suite"
            echo "::endgroup::"
          done
      # Their own process: MONGODB_URI is read once, when the config module loads,
      # and the unit tests above must keep the unreachable address they are given.
      - name: Tests against a real MongoDB
        working-directory: apps/backend
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: nuphos_test
        # A suite that skips here passes without having touched the database.
        run: |
          # A run block is `bash -e` without pipefail: without this, tee's exit hides bun's.
          set -o pipefail
          bun test $(find src -name '*.mongo.test.ts' | sort) 2>&1 | tee "$RUNNER_TEMP/mongo-tests.txt"
          if grep -q '^(skip)' "$RUNNER_TEMP/mongo-tests.txt"; then
            echo "::error::A *.mongo.test.ts test skipped against the real MongoDB"; exit 1
          fi
      - name: Check API schema is up-to-date
        working-directory: apps/backend
        run: bun run check:api
      - name: Build backend image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          load: false
          provenance: false

  # The Desktop app driven against a real backend, MongoDB, file store and OpenAB,
  # with a deterministic agent in place of a model: `bun run e2e`, the same command
  # a contributor runs. It gates pull requests; the merge queue skips it (see `if`).
  e2e:
    # The main scenarios and the suites that start a stack of their own run side by side;
    # the main leg keeps the check name and the `e2e` artifact.
    name: Desktop against a real backend${{ matrix.part == 'standalone' && ' (standalone suites)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        part: [main, standalone]
    needs: changes
    # On dispatch `changes` is skipped, which skips this job unless the condition says otherwise.
    # Not in the merge queue: each PR already passed it, and one flaky run there ejects
    # the PR and rebuilds every group behind it.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name != 'merge_group' && needs.changes.outputs.e2e == 'true') }}
    # A one-day trial of instabox runners (ubuntu-24.04 image, 4 vCPU / 8 GiB),
    # outside the hosted-runner concurrency limit. Revert to ubuntu-24.04 if jobs queue.
    # Only this repository's own code runs on ours; any other pull request stays on GitHub's hosts.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.real_disk && 'ubuntu-24.04' || (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04' }}
    # The main leg takes about 46 minutes with openab from the cache, the standalone one
    # about 6. A change to prepare.mjs or the openab source misses that cache until it
    # lands on main, and compiling openab adds about 6 minutes.
    timeout-minutes: 50
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Ubuntu 24.04 keeps unprivileged user namespaces from Chrome, so the headless Chrome the
      # second computer drives cannot start its sandbox; our own runners do not restrict them.
      - name: Let Chrome start its sandbox
        if: runner.environment == 'github-hosted'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Attested openab from openab-cache.yml on main; otherwise the next step compiles it.
      - id: openab
        uses: ./.github/actions/openab-binaries
      # Always staged: the app runs its own local agents from it. A cache hit reuses that openab.
      - name: Stage the local runtime
        working-directory: apps/desktop
        run: node local-runtime/prepare.mjs --targets linux-x64 --require
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd apps/backend && bun install --frozen-lockfile)
          (cd apps/desktop && pnpm install --frozen-lockfile)
      # The scenarios' 60 s wait for MongoDB must not include a cold image pull (#3102).
      # Keep the tags in step with MONGO_IMAGE in scripts/e2e/stack.ts and STORAGE_IMAGE in storage.ts.
      - name: Pull the MongoDB and file store images
        run: |
          docker pull mongo:8.0.32
          docker pull rustfs/rustfs:1.0.0
      - name: Run isolated real-disk Desktop evidence
        if: matrix.part == 'main' && github.event_name == 'workflow_dispatch' && inputs.real_disk
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/real-disk-shots
          OPENAB: ${{ github.workspace }}/apps/desktop/build/local-runtime/linux-x64/openab
        run: |
          set -euo pipefail
          workdir=$(mktemp -d "$RUNNER_TEMP/nuphos-e2e-disk.XXXXXX")
          disk="$workdir/disk.img"
          mountpoint="$workdir/mount"
          mkdir -p "$mountpoint" "$E2E_ARTIFACTS"
          # Install Electron before HOME points at the nearly full test filesystem.
          (cd apps/desktop && xvfb-run --auto-servernum pnpm exec electron --version)
          truncate -s 2G "$disk"
          mkfs.ext4 -q -F -m 0 "$disk"
          sudo mount -o loop "$disk" "$mountpoint"
          trap 'sudo umount "$mountpoint"; rm -f "$disk"; rmdir "$mountpoint" "$workdir"' EXIT
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          # ext4 metadata consumes space too; size the filler from the actual filesystem.
          fill_bytes=$(python3 -c 'import os,sys; s=os.statvfs(sys.argv[1]); print(int((s.f_blocks * 0.94 - (s.f_blocks - s.f_bfree)) * s.f_frsize))' "$mountpoint")
          test "$fill_bytes" -gt 0
          fallocate -l "$fill_bytes" "$mountpoint/fill"
          E2E_DISK_HOME="$mountpoint" E2E_DISK_FILL="$mountpoint/fill" xvfb-run --auto-servernum bun scripts/e2e/run-real-disk.ts
      - name: Upload real-disk screenshots
        if: always() && matrix.part == 'main' && github.event_name == 'workflow_dispatch' && inputs.real_disk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-disk-screenshots
          path: |
            ${{ runner.temp }}/real-disk-shots/real-disk-before.png
            ${{ runner.temp }}/real-disk-shots/real-disk-dismissed.png
            ${{ runner.temp }}/real-disk-shots/real-disk-second-window.png
            ${{ runner.temp }}/real-disk-shots/real-disk-restarted.png
            ${{ runner.temp }}/real-disk-shots/real-disk-space-freed.png
          if-no-files-found: warn
      # Its own run, so a failure in the shared scenarios cannot mask a missing path.
      - name: Check every way into the product
        if: matrix.part == 'standalone' && (github.event_name != 'workflow_dispatch' || !inputs.real_disk)
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-entry-points
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          xvfb-run --auto-servernum bun run e2e:entry-points
      - name: Run the end-to-end scenarios
        if: matrix.part == 'main' && (github.event_name != 'workflow_dispatch' || !inputs.real_disk)
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          xvfb-run --auto-servernum bun run e2e
      - name: Run Bot onboarding lifecycle scenarios
        if: matrix.part == 'standalone' && (github.event_name != 'workflow_dispatch' || !inputs.real_disk)
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-onboarding
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          xvfb-run --auto-servernum bun run e2e:bot-onboarding
      # How fast a chat shows after its row is clicked, against the budgets in run-chat-switch.ts.
      - name: Time chat switches
        if: matrix.part == 'standalone' && (github.event_name != 'workflow_dispatch' || !inputs.real_disk)
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-chat-switch
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          xvfb-run --auto-servernum bun run e2e:chat-switch
      # A stack of its own: it restarts its backend for the session-home sweep (#4265).
      - name: Remove an archived Task's home from its computer
        if: matrix.part == 'standalone' && (github.event_name != 'workflow_dispatch' || !inputs.real_disk)
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-session-homes
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          bun run e2e:session-homes
      # Logs and a screenshot after each scenario; the database and the app's sign-in files are left out.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e${{ matrix.part == 'standalone' && '-standalone' || '' }}
          path: |
            ${{ runner.temp }}/e2e
            !${{ runner.temp }}/e2e/mongo
            !${{ runner.temp }}/e2e/sign-in
            ${{ runner.temp }}/e2e-onboarding
            !${{ runner.temp }}/e2e-onboarding/mongo
            !${{ runner.temp }}/e2e-onboarding/sign-in
            ${{ runner.temp }}/e2e-chat-switch
            !${{ runner.temp }}/e2e-chat-switch/mongo
            !${{ runner.temp }}/e2e-chat-switch/sign-in
            ${{ runner.temp }}/e2e-entry-points
            !${{ runner.temp }}/e2e-entry-points/mongo
            !${{ runner.temp }}/e2e-entry-points/sign-in
            ${{ runner.temp }}/e2e-session-homes
            !${{ runner.temp }}/e2e-session-homes/mongo
            !${{ runner.temp }}/e2e-session-homes/sign-in
          retention-days: 7

  # Typecheck, tests and the bundles do not depend on macOS, so a PR gets them
  # from a Linux runner instead of waiting for a Mac.
  desktop-checks:
    name: Desktop (typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        # electron:build goes through vite/esbuild, which strips types without
        # checking them — #616 shipped three type errors to main this way,
        # including two unregistered analytics events that would have silently
        # dropped telemetry.
        working-directory: apps/desktop
        run: pnpm typecheck
      # Lint runs in its own Linux job (desktop-lint) so it overlaps these steps.
      - name: Run tests
        timeout-minutes: 3
        working-directory: apps/desktop
        run: pnpm test
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Run sidebar UI tests in isolated processes
        working-directory: apps/desktop
        run: pnpm test:ui
      # Bundling catches what tsc and eslint cannot (unresolved assets, CSS,
      # Rollup errors) and takes seconds, so it runs on every desktop change.
      - name: Build renderer and main bundles
        working-directory: apps/desktop
        run: pnpm exec vite build
      # `nuphos agent` runs this bundle under plain Node. An `electron` import
      # that reaches it only fails when the host loads (#2749), so load it.
      - name: Load the nuphos agent host bundle
        working-directory: apps/desktop
        run: |
          bun build electron/main/local-runtime/cli-host.ts --target=node --format=esm --external @napi-rs/keyring --outfile "$RUNNER_TEMP/host.mjs"
          (env -u NUPHOS_AGENT_HOME node "$RUNNER_TEMP/host.mjs" 2>&1 || true) | tee /dev/stderr | grep -qF 'NUPHOS_AGENT_HOME is not set'

  # Some tests only run on macOS (the keychain, macOS config paths), and the
  # native addon only compiles there. A PR or queue entry gets the Mac only when
  # it changes a packaging input or the addon (desktop_package); every other
  # desktop change is checked by the Linux job above, and its skipped Mac job
  # still passes the required check. The full package runs on main every
  # night, so what only the Mac catches shows up within a day.
  # Staging and electron-builder are skipped in the queue: the PR already
  # packaged the same inputs.
  desktop:
    name: Desktop (Nuphos macOS package)
    needs: changes
    # On schedule `changes` is skipped; !cancelled() keeps this job running.
    if: >-
      ${{ !cancelled() && (github.event_name == 'schedule' ||
      (github.event_name != 'merge_group' && needs.changes.outputs.desktop == 'true' &&
      needs.changes.outputs.desktop_package == 'true')) }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Run tests
        timeout-minutes: 3
        working-directory: apps/desktop
        run: pnpm test
      # On macOS this also compiles the native addon (apps/desktop/native).
      - name: Build renderer and main bundles
        working-directory: apps/desktop
        run: pnpm exec vite build
      - name: Stage the local agent adapter
        if: github.event_name != 'merge_group'
        working-directory: apps/desktop
        run: node local-runtime/prepare.mjs --targets darwin-arm64,darwin-x64 --no-openab
      # Exercise both native architectures without producing release ZIP/DMG files.
      - name: Package Nuphos macOS app
        if: github.event_name != 'merge_group'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac --arm64 --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Nobody watches the nightly run, so a failure is posted to the maintainers.
      - name: Report a failed nightly run
        if: failure() && github.event_name == 'schedule'
        env:
          WEBHOOK: ${{ secrets.NIGHTLY_MACOS_FAILURE_WEBHOOK }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          curl -fsS -X POST "$WEBHOOK" -H 'content-type: application/json'
          -d "{\"run\":\"$RUN\",\"commit\":\"$GITHUB_SHA\"}"

  # Type-aware ESLint is the slowest step in both apps, so it runs beside their
  # main jobs instead of after typecheck. A PR then waits for the slower of the
  # two, not their sum.
  backend-lint:
    name: Backend lint
    needs: changes
    # On push, changes is skipped, so !cancelled() keeps this job from skipping with it.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ESLint's plugin set needs `Set.prototype.union` (Node 22+).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: apps/backend
        # BLOCKING. Errors are at zero here; warnings do not fail the run.
        # Type-aware linting builds the same program `tsc --noEmit` does, so it
        # needs the same heap bump as the backend Typecheck step.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run lint

  # Lint does not depend on macOS, so it runs on Linux instead of the macOS
  # runner the desktop package needs.
  desktop-lint:
    name: Desktop lint
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.desktop == 'true') }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/desktop
        # BLOCKING. Errors are at zero here; warnings do not fail the run. Runs
        # type-aware rules, so it needs the same heap headroom as the desktop
        # typecheck.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm lint

  dev-scripts:
    name: Dev scripts
    needs: changes
    if: needs.changes.outputs.dev_scripts == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint scripts/
        # BLOCKING. Errors are at zero here; warnings do not fail the run.
        run: bun run lint
      - name: Test the dev launcher's local stack wiring
        run: node --test --experimental-strip-types scripts/dev*.test.ts
      - name: Test which backend log lines fail an e2e run
        run: node --test --experimental-strip-types scripts/e2e/*.test.ts
      - name: Test filling mobile strings from the Desktop translations
        run: node --test scripts/fill-mobile-locales.test.mjs
      - name: Test that every release runs the provenance gate
        run: node --test scripts/release-workflows.test.mjs
      - name: iOS UI results comparison tests
        run: node --test scripts/compare-ios-ui-results.test.mjs
      # BLOCKING. The custom comment-discipline rules are only worth having if
      # they still fire; a rule that silently stops reporting is worse than no
      # rule. These suites fail if any of the three does.
      - name: Test custom ESLint rules
        run: node --test eslint-rules/*.test.mjs
      # BLOCKING, for the same reason. The PreToolUse hook is what stops an
      # agent editing its way out of a rule; nothing else notices when its
      # path patterns stop matching.
      - name: Test the lint-config write guard
        run: bash .claude/hooks/guard-lint-config.test.sh

  lint-config-integrity:
    name: Lint config integrity
    needs: changes
    if: needs.changes.outputs.lint_config == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Every config is loaded for real, so every config's plugins must be on
      # disk. Nothing is built or typechecked here — installs are the whole cost.
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install backend dependencies
        working-directory: apps/backend
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Test the integrity checker
        run: node --test scripts/check-lint-config-integrity.test.mjs
      # BLOCKING. A rule that resolves to severity 0, or whose implementation is
      # a deprecated stub, reads as enforced in the config and enforces nothing.
      - name: Check lint config integrity
        run: node scripts/check-lint-config-integrity.mjs

  import-cycles:
    name: Import cycles
    needs: changes
    if: needs.changes.outputs.import_cycles == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'instabox-medium' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # madge parses the sources itself, so only the root toolchain is needed —
      # no app install, no type program. The whole job is a few seconds.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test the cycle checker
        run: node --test scripts/check-import-cycles.test.mjs
      # BLOCKING as a ratchet: the cycles already here are recorded and allowed,
      # a new one fails. Nothing else in this repo detects them — `import-x/no-cycle`
      # never fired on a `.ts` file.
      - name: Check import cycles
        run: bun run check:cycles

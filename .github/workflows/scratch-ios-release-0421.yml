# Scratch only (do not merge): the whole UI target on ios-v0.42.1 (854d918f), serial, for the release.
name: scratch iOS release 0.42.1
on:
  push:
    branches: [scratch/ios-release-0421]
permissions:
  contents: read
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 854d918f6370a258274886eb768c4c18da7bf1f1
      - name: Test
        working-directory: apps/ios
        run: |
          type=$(xcrun simctl list devicetypes | sed -n 's/^iPhone 17 Pro (\(.*\))$/\1/p' | head -1)
          udid=$(xcrun simctl create iphone "$type"); xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b >/dev/null
          xcrun simctl ui "$udid" appearance light
          xcodebuild test -project nuphos-ios.xcodeproj -scheme nuphos-ios -destination "id=$udid" -parallel-testing-enabled NO \
            -only-testing:nuphos-iosUITests -resultBundlePath "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || echo "xcodebuild exited $?"
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/tests.json"
          grep -iE "^Test Case .*(passed|failed|skipped)|error: |TEST (FAILED|SUCCEEDED)" "$RUNNER_TEMP/xcodebuild.log" | cut -c1-300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: ios-ui-release-0421-results
          path: ${{ runner.temp }}/tests.json
          retention-days: 30

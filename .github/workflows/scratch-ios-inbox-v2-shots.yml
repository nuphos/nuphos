# Scratch only: head-pinned Inbox v2 screenshots for nuphos/nuphos#2665 on iPhone, iPhone Duo (open) and iPad.
name: scratch iOS Inbox v2 shots
on:
  push:
    branches: [scratch/ios-inbox-v2-shots]
permissions:
  contents: read
jobs:
  run:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read PR head
        run: echo "PR_HEAD=$(cat scratch-ios-inbox-v2/HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PR_HEAD }}
          path: pr
      - name: Unit tests
        run: bash pr/apps/ios/tests/run.sh
      - name: Build duorig
        run: |
          git clone -q https://github.com/Saffsanity/sill "$RUNNER_TEMP/sill" && git -C "$RUNNER_TEMP/sill" checkout -q 150479b
          "$RUNNER_TEMP/sill/Tests/duorig/run.sh" build
      - name: Run
        run: bash scratch-ios-inbox-v2/run.sh "$PWD/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: inbox-v2-shots
          path: out/

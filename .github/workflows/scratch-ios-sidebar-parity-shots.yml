# Scratch only: head-pinned Bots/Tasks list screenshots for nuphos/nuphos#2703 on iPhone and iPad.
name: scratch iOS sidebar parity shots
on:
  push:
    branches: [scratch/ios-sidebar-parity-shots]
permissions:
  contents: read
jobs:
  run:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read PR head
        run: echo "PR_HEAD=$(cat scratch-ios-sidebar-parity/HEAD)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.PR_HEAD }}
          path: pr
      - name: Unit tests
        run: bash pr/apps/ios/tests/run.sh
      - name: Run
        run: bash scratch-ios-sidebar-parity/run.sh "$PWD/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sidebar-parity-shots
          path: out/

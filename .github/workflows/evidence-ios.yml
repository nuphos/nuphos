name: evidence-ios-workspace
on:
  push:
    branches: [evidence/ios-integration-2175-final]
jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shoot
        working-directory: apps/ios
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|test("^iPhone 17 Pro$"))][0].udid // empty')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|startswith("iPhone"))][0].udid')
          echo "sim $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          git fetch --no-tags --depth=1 origin d69ee5a038ea00c9be8e324c4ffa623aebc92fc7
          status=0
          for variant in before after; do
            source=HEAD
            [ "$variant" != before ] || source=d69ee5a038ea00c9be8e324c4ffa623aebc92fc7
            for file in nuphos-ios/Services/Chat/ChatModels.swift nuphos-ios/Views/Chat/ConversationView.swift nuphos-ios/Views/Chat/ToolDetailSheet.swift; do
              git show "$source:apps/ios/$file" > "$file"
            done
            extra=()
            [ "$variant" != after ] || extra=(-only-testing:nuphos-iosUITests/IntegrationQuestionUITests)
            mkdir -p "$RUNNER_TEMP/out/$variant"
            xcodebuild test -project nuphos-ios.xcodeproj -scheme nuphos-ios -configuration Debug \
              -destination "id=$UDID" -only-testing:nuphos-iosUITests/IntegrationEvidenceUITests "${extra[@]}" \
              -jobs 2 -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/$variant.xcresult" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= 2>&1 | tail -40 || status=1
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$variant.xcresult" --output-path "$RUNNER_TEMP/out/$variant" || true
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$variant.xcresult" > "$RUNNER_TEMP/out/$variant/summary.json" || true
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shots
          path: ${{ runner.temp }}/out

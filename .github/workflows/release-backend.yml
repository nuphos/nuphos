name: Release Backend Image

on:
  # Dispatch from main after creating the tag; see release-provenance.yml.
  workflow_dispatch:
    inputs:
      tag:
        description: backend-vX.Y.Z tag to publish (on a merge-queue commit of main)
        type: string
        required: true

concurrency:
  group: release-backend-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provenance:
    uses: ./.github/workflows/release-provenance.yml
    with:
      tag: ${{ inputs.tag }}
      prefix: backend-v
    permissions:
      contents: read
      actions: read

  publish:
    needs: provenance
    runs-on: ubuntu-latest
    environment: backend-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless image signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/backend/package.json').version")
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Expected a stable SemVer version'; exit 1; }
          [[ "$RELEASE_TAG" == "backend-v$VERSION" ]] || { echo '::error::Tag must match the component package version'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish self-hosted image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nuphos/backend:v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.provenance.outputs.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature bound to this workflow's GitHub OIDC identity. The
      # identity names main (where this runs), so the signed `commit`
      # annotation records the release commit it built.
      - name: Sign image
        env:
          IMAGE: ghcr.io/nuphos/backend@${{ steps.image.outputs.digest }}
          COMMIT: ${{ needs.provenance.outputs.sha }}
        run: cosign sign --yes -a "commit=$COMMIT" "$IMAGE"

  announce:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="backend-v$VERSION"
          IMAGE="ghcr.io/nuphos/backend:v$VERSION"
          printf 'Self-hosted Backend image: `%s` (linux/amd64 and linux/arm64).\n\nImage digest: `%s`.\n' "$IMAGE" "$DIGEST" > release-notes.md
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Backend v$VERSION" --latest=false --generate-notes --notes-file release-notes.md
          fi

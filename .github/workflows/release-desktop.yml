name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'nuphos/nuphos' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Expected a stable SemVer version'; exit 1; }
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || { echo '::error::Tag must match the component package version'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Release commit must be on main'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: mac
            targets: darwin-arm64,darwin-x64
          - runner: windows-2025
            platform: win
            targets: win32-x64,win32-arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            targets: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            targets: linux-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stage local runtime
        env:
          TARGETS: ${{ matrix.targets }}
        run: node local-runtime/prepare.mjs --targets "$TARGETS" --require
      - name: Build application
        run: pnpm exec vite build
      - name: Restore notarization key
        if: matrix.platform == 'mac'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_BASE64"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Sign, notarize and publish macOS
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" && test -n "$APPLE_TEAM_ID"
          pnpm exec electron-builder --mac --publish always --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Gate macOS update compatibility
        if: matrix.platform == 'mac'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          aws s3 cp s3://nuphos-releases/desktop/latest-mac.yml latest-mac.yml
          # electron-updater compares os.release(): macOS 12 is Darwin 21.
          if ! grep -q '^minimumSystemVersion:' latest-mac.yml; then
            echo 'minimumSystemVersion: 21.0.0' >> latest-mac.yml
          fi
          aws s3 cp latest-mac.yml s3://nuphos-releases/desktop/latest-mac.yml --content-type text/yaml
      - name: Remove notarization key
        if: always() && matrix.platform == 'mac'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Publish unsigned Windows installers
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win --publish always
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Publish Linux AppImage
        if: matrix.platform == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: pnpm exec electron-builder --linux --"$ARCH" --publish always

  announce:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          BASE='https://nuphos-releases.s3.amazonaws.com/desktop'
          cat > release-notes.md <<EOF
          macOS builds are signed and notarized. Windows and Linux builds are unsigned.

          - [macOS Apple Silicon]($BASE/Nuphos-$VERSION-arm64.dmg)
          - [macOS Intel]($BASE/Nuphos-$VERSION-x64.dmg)
          - [Windows x64]($BASE/Nuphos-$VERSION-x64.exe)
          - [Windows arm64]($BASE/Nuphos-$VERSION-arm64.exe)
          - [Linux x64]($BASE/Nuphos-$VERSION-x86_64.AppImage)
          - [Linux arm64]($BASE/Nuphos-$VERSION-arm64.AppImage)
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --latest --generate-notes --notes-file release-notes.md
          fi

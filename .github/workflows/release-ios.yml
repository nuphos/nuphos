name: Release iOS

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch: {}

concurrency:
  group: release-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'nuphos/nuphos' && startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version apps/ios/package.json)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo '::error::Expected a stable SemVer version'; exit 1; }
          [[ "$RELEASE_TAG" == "ios-v$VERSION" ]] || { echo '::error::Tag must match the component package version'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Release commit must be on main'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  testflight:
    needs: validate
    environment: ios-release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore App Store Connect API key
        id: restore_key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      # Manual signing from stored assets. A runner's keychain starts empty, so
      # automatic signing would ask Apple for a new certificate on every run and
      # exhaust the account's limit. The Apple Distribution identity and the
      # App Store profile for ai.nuphos.ios are created once and reused.
      - name: Install the signing identity
        env:
          P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Prepend rather than replace: the default keychain still holds the
          # Apple intermediate certificates codesign needs to build the chain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          P12="$RUNNER_TEMP/dist.p12"
          echo "$P12_BASE64" | base64 -d > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign waits on a keychain prompt nobody answers.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$P12"
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILES/nuphos-appstore.mobileprovision"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # codesign refuses an entitlement the profile does not grant, so a
      # profile issued before Push Notifications was enabled ships without push.
      - name: Match push entitlement to the profile
        working-directory: apps/ios
        run: |
          set -euo pipefail
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/nuphos-appstore.mobileprovision" > "$PROFILE_PLIST"
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "::warning::The App Store profile lacks aps-environment; this build ships without push notifications."
            /usr/libexec/PlistBuddy -c 'Delete :aps-environment' nuphos-ios/nuphos-ios.entitlements
          fi

      # The build number is the UTC minute of this run. Build numbers must keep
      # increasing across every upload of the app, including those made before
      # releases moved to this repository, so a per-repository run counter
      # would restart below them.
      - name: Choose the build number
        id: build
        run: echo "number=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # Signing settings live in the app target's Release configuration, not
      # here: a setting passed on the command line reaches every target in the
      # build, and the SPM package targets reject a provisioning profile.
      - name: Archive
        working-directory: apps/ios
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          xcodebuild -project nuphos-ios.xcodeproj -scheme nuphos-ios -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/nuphos.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -40

      - name: Upload to TestFlight
        working-directory: apps/ios
        env:
          KEY_PATH: ${{ steps.restore_key.outputs.key_path }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/nuphos.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40

      # External testers only see builds attached to their group, and a build
      # attached to an external group stays invisible until it is submitted for
      # Beta App Review, which is what `--submit` does.
      - name: Add the build to the External Beta group
        id: beta
        env:
          KEY_PATH: ${{ steps.restore_key.outputs.key_path }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APP_ID: '6812533633'
          GROUP: External Beta
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          ASC_VERSION: 5.14.3
          ASC_SHA256: 8445a2110c4472e926bac69cf90ebcec91a28e4eb142b6d2c81fc4addb16aaae
        run: |
          set -euo pipefail
          # Pinned: the steps below use subcommands and flags that older asc
          # builds lack, and Homebrew on the runner does not always give the
          # newest one.
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/asc" \
            "https://github.com/rudrankriyam/App-Store-Connect-CLI/releases/download/$ASC_VERSION/asc_${ASC_VERSION}_macOS_arm64"
          echo "$ASC_SHA256  $RUNNER_TEMP/bin/asc" | shasum -a 256 -c - >/dev/null
          chmod +x "$RUNNER_TEMP/bin/asc"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          asc auth login --bypass-keychain --skip-validation --name ci \
            --key-id "$KEY_ID" --issuer-id "$ISSUER" --private-key "$KEY_PATH" >/dev/null
          STATE=''
          for _ in $(seq 1 60); do
            BUILD="$(asc builds list --app "$APP_ID" --platform IOS --build-number "$BUILD_NUMBER" --output json \
              | jq -c '(.data // .)[0] // {}')"
            STATE="$(jq -r '.attributes.processingState // ""' <<<"$BUILD")"
            case "$STATE" in
              VALID) break ;;
              FAILED|INVALID) echo "::error::App Store Connect rejected build $BUILD_NUMBER ($STATE)"; exit 1 ;;
              *) sleep 30 ;;
            esac
          done
          if [[ "$STATE" != "VALID" ]]; then
            echo "::warning::Build $BUILD_NUMBER is still processing after 30 minutes; attach it to $GROUP by hand."
            exit 0
          fi
          asc builds add-groups --app "$APP_ID" --platform IOS --build-number "$BUILD_NUMBER" \
            --group "$GROUP" --submit --confirm
          echo "Build $BUILD_NUMBER added to $GROUP and submitted for Beta App Review." >> "$GITHUB_STEP_SUMMARY"
          echo "build_id=$(jq -r .id <<<"$BUILD")" >> "$GITHUB_OUTPUT"

      # One App Store version is prepared at a time. A release cut while the
      # previous one is still in review withdraws that submission and reuses its
      # version record. A new record starts from the live version's metadata.
      # What's New and the screenshots always come from the repository.
      - name: Submit the version for App Store review
        if: steps.beta.outputs.build_id != ''
        working-directory: apps/ios
        env:
          APP_ID: '6812533633'
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_ID: ${{ steps.beta.outputs.build_id }}
        run: |
          set -euo pipefail
          echo "asc $(asc --version)" >> "$GITHUB_STEP_SUMMARY"

          # Everything that can fail without touching App Store Connect runs
          # before the submission is withdrawn. published.txt lists every
          # published screenshot set in order, each image with its display
          # type and SHA-256; see app-store/README.md.
          SHOTS="$RUNNER_TEMP/screenshots"
          while read -r TYPE SHA URL; do
            mkdir -p "$SHOTS/$TYPE"
            curl -fsSL --retry 3 -o "$SHOTS/$TYPE/$(basename "$URL")" "$URL"
            echo "$SHA  $SHOTS/$TYPE/$(basename "$URL")" | shasum -a 256 -c - >/dev/null
          done < app-store/published.txt
          TYPES="$(awk '!seen[$1]++ { print $1 }' app-store/published.txt)"
          for TYPE in $TYPES; do
            asc screenshots validate --path "$SHOTS/$TYPE" --device-type "$TYPE" >/dev/null
          done

          # A version cannot be edited while a submission holds it. Only
          # submissions that carry an App Store version are withdrawn; in-app
          # events and custom product pages in review are left alone.
          PENDING='READY_FOR_REVIEW,WAITING_FOR_REVIEW,IN_REVIEW,UNRESOLVED_ISSUES'
          submissions() {
            asc review submissions-list --app "$APP_ID" --platform IOS --state "$1" \
              --include appStoreVersionForReview --output json \
              | jq -r '(.data // .)[] | select(.relationships.appStoreVersionForReview.data != null) | .id'
          }
          OPEN="$(submissions "$PENDING")"
          for SUBMISSION in $OPEN; do
            asc review submissions-update --id "$SUBMISSION" --canceled=true --confirm >/dev/null
            echo "Withdrew review submission $SUBMISSION." >> "$GITHUB_STEP_SUMMARY"
          done
          for _ in $(seq 1 30); do
            OPEN="$(submissions "$PENDING,CANCELING")"
            if [[ -z "$OPEN" ]]; then break; fi
            sleep 10
          done
          if [[ -n "$OPEN" ]]; then
            echo "::error::Review submission $OPEN is still open after five minutes; rerun this job once it has cleared."
            exit 1
          fi

          version_id() {
            asc versions list --app "$APP_ID" --platform IOS "$@" --output json | jq -r '(.data // .)[0].id // ""'
          }
          VERSION_ID="$(version_id --version "$VERSION")"
          if [[ -z "$VERSION_ID" ]]; then
            VERSION_ID="$(version_id --state PREPARE_FOR_SUBMISSION,READY_FOR_REVIEW,DEVELOPER_REJECTED,REJECTED,METADATA_REJECTED,INVALID_BINARY)"
            if [[ -n "$VERSION_ID" ]]; then
              asc versions update --version-id "$VERSION_ID" --version "$VERSION" >/dev/null
            else
              LIVE="$(asc versions list --app "$APP_ID" --platform IOS --state READY_FOR_SALE --output json \
                | jq -r '(.data // .)[0].attributes.versionString')"
              VERSION_ID="$(asc versions create --app "$APP_ID" --platform IOS --version "$VERSION" \
                --copy-metadata-from "$LIVE" --exclude-fields whatsNew --release-type AFTER_APPROVAL --output json \
                | jq -r '(.data // .).id')"
            fi
          fi
          asc localizations update --version "$VERSION_ID" --locale en-US --whats-new "$(cat whats-new.txt)" >/dev/null

          for TYPE in $TYPES; do
            asc screenshots upload --app "$APP_ID" --version-id "$VERSION_ID" --locale en-US \
              --path "$SHOTS/$TYPE" --device-type "$TYPE" --replace --confirm >/dev/null
          done
          {
            echo 'Screenshots on this version:'
            asc screenshots list --app "$APP_ID" --version-id "$VERSION_ID" --locale en-US --output markdown
          } >> "$GITHUB_STEP_SUMMARY"

          # Submit only if the version shows exactly the published sets: no
          # other display type, and in each set the same files, in order, with
          # the MD5 App Store Connect recorded for the uploaded source file.
          # That checksum can be empty for a moment after an upload.
          while read -r TYPE SHA URL; do
            echo "APP_$TYPE $(basename "$URL") $(md5 -q "$SHOTS/$TYPE/$(basename "$URL")")"
          done < app-store/published.txt | sort -s -k1,1 > "$RUNNER_TEMP/expected.txt"
          for _ in $(seq 1 12); do
            asc screenshots list --app "$APP_ID" --version-id "$VERSION_ID" --locale en-US --output json \
              | jq -r '.sets | sort_by(.set.attributes.screenshotDisplayType)[]
                  | .set.attributes.screenshotDisplayType as $t
                  | .screenshots[] | "\($t) \(.attributes.fileName) \(.attributes.sourceFileChecksum // "")"' \
              > "$RUNNER_TEMP/actual.txt"
            if cmp -s "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"; then break; fi
            sleep 10
          done
          if ! diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"; then
            echo '::error::The screenshots on the version do not match app-store/published.txt; nothing was submitted.'
            exit 1
          fi

          asc review submit --app "$APP_ID" --version-id "$VERSION_ID" --build-id "$BUILD_ID" --confirm
          echo "Version $VERSION submitted for App Store review." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --latest=false --title "iOS v$VERSION" --notes-file apps/ios/whats-new.txt

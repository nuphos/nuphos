# Self-hosted Renovate. The repository config (schedule, seven-day release-age
# delay, grouping) is renovate.json; this workflow only runs the bot. See
# CONTRIBUTING.md, "Dependencies".
name: Renovate

on:
  schedule:
    # Every hour on Monday 00:00-05:59 UTC, the window renovate.json's
    # `schedule` allows. Renovate does nothing outside it.
    - cron: '17 0-5 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    # Skipped until the App is set up (CONTRIBUTING.md, "Running Renovate").
    if: github.repository == 'nuphos/nuphos' && vars.RENOVATE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds RENOVATE_APP_PRIVATE_KEY, so the key is only exposed to this job.
    environment: renovate
    steps:
      # A dedicated GitHub App, installed on this repository only. Its
      # installation token lets Renovate's commits trigger CI and be signed by
      # GitHub (platformCommit), which GITHUB_TOKEN cannot do.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: nuphos

      # GitHub authors platform commits as the App's bot user, so the DCO
      # sign-off must name that same identity.
      - id: identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.155.8
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: '["nuphos/nuphos"]'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: ${{ steps.identity.outputs.author }}
          RENOVATE_COMMIT_BODY: 'Signed-off-by: ${{ steps.identity.outputs.author }}'

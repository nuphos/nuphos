name: Desktop Windows Codex login

# Real Codex on Windows, signing in the owner's home and the default Codex
# agent's home that links to it (#2653). Codex saves auth.json by renaming a new
# file over it, and refuses to do that over the hard link main makes.
on:
  pull_request:
    paths:
      - apps/desktop/electron/main/local-runtime/owner-file-link.ts
      - apps/desktop/scripts/windows-codex-login-link.ts
      - .github/workflows/desktop-windows-codex-login.yml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-login-link:
    name: Codex login stays shared with the owner on Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop/electron/main/local-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Codex
        run: |
          npm install -g @openai/codex@0.170.0
          echo "CODEX_BIN=$(npm prefix -g)\\codex.cmd" >> "$GITHUB_ENV"
          "$(npm prefix -g)/codex.cmd" --version
      # Real Codex saves each login by renaming a new auth.json over the old one (#2653).
      - name: Before (main) Codex cannot save a login over the hard link
        run: |
          git show origin/main:apps/desktop/electron/main/local-runtime/agent-home.ts > agent-home.main.ts
          LINK_MODULE=agent-home.main.ts EXPECT=refused node --test ../../../scripts/windows-codex-login-link.ts
      - name: After (this branch) the newer login reaches the owner and stays
        run: LINK_MODULE=owner-file-link.ts EXPECT=shared node --test ../../../scripts/windows-codex-login-link.ts

name: Release runtime

# Releases the runtime when a merged pull request changes its version.
#
# main only takes signed commits through a pull request, so a release starts as
# a pull request that bumps apps/runtime/package.json (the SDK and CLI update
# workflows open one). Once it lands, this tags that commit runtime-vX.Y.Z and
# publishes every provider from the tag. A push that leaves the version on an
# existing tag publishes nothing.

on:
  push:
    branches: [main]
    paths:
      - apps/runtime/package.json

permissions:
  contents: read

concurrency:
  group: runtime-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/runtime

jobs:
  tag:
    if: github.ref == 'refs/heads/main' && vars.RUNTIME_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag the new version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version is not a stable semver value: '$VERSION'"
            exit 1
          fi
          TAG="runtime-v${VERSION}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          node scripts/check-legacy-version.mjs "$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.version != ''
    uses: ./.github/workflows/runtime-build.yml
    permissions:
      contents: write
      packages: write
    with:
      release_tag: runtime-v${{ needs.tag.outputs.version }}
      provider: all
      reuse_base: false

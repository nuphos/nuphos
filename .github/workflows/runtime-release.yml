name: Release runtime

# Bumps the version on main, tags it, and publishes the images for that tag.
#
# Releases are on demand: the image changes rarely, and every change to it has
# already passed CI on main by the time this runs. The bump commit is
# version-only.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        options: [patch, minor]
        default: patch
        required: true
      provider:
        description: Runtime provider to publish
        type: choice
        options: [claude, codex, grok, antigravity, all]
        default: all
        required: true
      reuse_base:
        description: Reuse the published provider base at the pinned OpenAB revision
        type: boolean
        default: false

run-name: Release ${{ inputs.bump }} (${{ inputs.provider }})

permissions:
  contents: write

concurrency:
  group: runtime-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/runtime

jobs:
  tag:
    if: github.ref == 'refs/heads/main' && vars.RUNTIME_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump the version and tag it
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT="$(jq -r .version package.json)"
          if [[ ! "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version is not a stable semver value: '$CURRENT'"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          if [[ "$BUMP" == minor ]]; then
            VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          node scripts/check-legacy-version.mjs "$VERSION"
          if git rev-parse --verify --quiet "refs/tags/runtime-v${VERSION}" >/dev/null; then
            echo "::error::tag runtime-v${VERSION} already exists"
            exit 1
          fi

          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): runtime-v${VERSION}"
          git tag "runtime-v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/runtime-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    uses: ./.github/workflows/runtime-build.yml
    permissions:
      contents: write
      packages: write
    with:
      release_tag: runtime-v${{ needs.tag.outputs.version }}
      provider: ${{ inputs.provider }}
      reuse_base: ${{ inputs.reuse_base }}

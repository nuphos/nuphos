name: openab cache

# Builds the openab binaries that release-desktop.yml and release-cli.yml ship,
# once per prepare.mjs (it pins OPENAB_COMMIT and the cargo flags) and rustc,
# attests them, and keeps them in a cache on main. A tag run can restore main's
# caches but not another tag's, so this is what lets both releases skip cargo
# (10-17 min per target). The releases ship a restored binary only if this
# workflow's attestation from main vouches for it, and compile otherwise.
# Linux builds here on 22.04, the oldest glibc either release supports; the
# Desktop AppImage still compiles on 24.04 when it misses.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/local-runtime/prepare.mjs
      - .github/workflows/openab-cache.yml
      - .github/actions/openab-binaries/action.yml
  # Compiles an OPENAB_COMMIT bump for every shipped target before it merges.
  # Its cache and attestations are scoped to the PR, which no release accepts.
  pull_request:
    paths:
      - apps/desktop/local-runtime/prepare.mjs
      - .github/workflows/openab-cache.yml
      - .github/actions/openab-binaries/action.yml
  # GitHub evicts a cache nobody has read for 7 days.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            targets: darwin-arm64,darwin-x64
          - runner: windows-2025
            targets: win32-x64,win32-arm64
          - runner: ubuntu-22.04
            targets: linux-x64
          - runner: ubuntu-22.04-arm
            targets: linux-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: openab
        uses: ./.github/actions/openab-binaries
        with:
          source-ref: ${{ github.ref }}
      # The same staging the releases run, so a hit here proves theirs.
      - name: Stage local runtime
        env:
          TARGETS: ${{ matrix.targets }}
        run: node local-runtime/prepare.mjs --targets "$TARGETS" --require
      # A fork PR gets no id-token, so it only builds.
      - if: steps.openab.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ~/.cache/nuphos/openab-*/target/*/release/openab
            ~/.cache/nuphos/openab-*/target/*/release/openab.exe
      - if: steps.openab.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.openab.outputs.key }}
          path: |
            ~/.cache/nuphos/openab-*/target/*/release/openab
            ~/.cache/nuphos/openab-*/target/*/release/openab.exe
      # A rejected entry keeps its key, so saving cannot replace it and every
      # release would compile without anyone noticing.
      - name: Fail on a rejected cache entry
        if: steps.openab.outputs.rejected != '0'
        env:
          KEY: ${{ steps.openab.outputs.key }}
        run: |
          echo "::error::The cache under $KEY holds openab binaries this workflow did not attest for this prepare.mjs. Delete that entry (gh cache delete) so the next run replaces it."
          exit 1

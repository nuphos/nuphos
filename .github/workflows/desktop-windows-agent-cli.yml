name: Desktop Windows agent CLI

# Installs Claude Code and OpenCode with npm on real Windows, as a user without
# the native installers would, and spawns the CLI findAgentCli picks the way
# the agents do: without a shell. It must pick the .exe, not npm's .cmd shim
# that fails with EINVAL (#3290).
on:
  pull_request:
    paths:
      - apps/desktop/electron/main/local-runtime/agent-cli-find.ts
      - apps/desktop/electron/main/local-runtime/agent-cli-apps.ts
      - apps/desktop/scripts/windows-npm-claude-spawn.ts
      - apps/desktop/scripts/windows-npm-opencode-turn.ts
      - apps/runtime/image/acp-shim.mjs
      - .github/workflows/desktop-windows-agent-cli.yml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-claude:
    name: npm Claude Code spawns on Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # A user's npm installs globals into %APPDATA%\npm, which findAgentCli
      # searches even off PATH; the runner's own prefix is elsewhere. npm 11
      # skips install scripts unless allowed, and this one places claude.exe.
      - name: Install Claude Code with npm into %APPDATA%\npm
        shell: pwsh
        run: |
          npm install -g --prefix "$env:APPDATA\npm" --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code
          Get-ChildItem "$env:APPDATA\npm"
      - name: It picks claude.exe, which runs
        working-directory: apps/desktop/electron/main/local-runtime
        run: node ../../../scripts/windows-npm-claude-spawn.ts agent-cli-find.ts exe
      # Without its postinstall (npm 11 skips unallowed scripts), bin\claude.exe
      # stays a placeholder script; the user must reinstall, and is told so.
      - name: An npm install without its postinstall fails to spawn plainly
        shell: pwsh
        working-directory: apps/desktop/electron/main/local-runtime
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\no-postinstall"
          npm install -g --prefix "$env:APPDATA\npm" --ignore-scripts @anthropic-ai/claude-code
          node ../../../scripts/windows-npm-claude-spawn.ts agent-cli-find.ts unstartable

  npm-opencode:
    name: npm OpenCode runs a first turn on Windows
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # opencode-ai's postinstall copies the platform binary to bin\opencode.exe.
      - name: Install OpenCode with npm into %APPDATA%\npm
        shell: pwsh
        run: |
          npm install -g --prefix "$env:APPDATA\npm" --allow-scripts=opencode-ai opencode-ai
          Get-ChildItem "$env:APPDATA\npm"
      # Through the runtime's ACP shim, as Desktop runs it, on one of OpenCode's
      # free models, which need no login.
      - name: It picks opencode.exe, and a first turn finishes
        working-directory: apps/desktop/electron/main/local-runtime
        env:
          OPENCODE_MODEL: opencode/big-pickle
        run: node ../../../scripts/windows-npm-opencode-turn.ts agent-cli-find.ts ../../../../runtime/image/acp-shim.mjs

name: Compose

on:
  pull_request:
    paths:
      - 'deploy/compose/**'
      - 'deploy/zeabur/**'
      - 'deploy/railway/**'
      - 'deploy/helm/**'
      - 'apps/backend/**'
      - 'apps/runtime/**'
      - '.github/workflows/compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Local stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate local secrets
        run: ./init-env.sh
      - name: Validate development overlay
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Build and start the complete stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Exercise sign-in, runtime and storage
        run: python3 smoke.py
      - name: Show container health
        if: always()
        run: docker compose ps -a
      - name: Show failed startup logs
        if: failure()
        run: docker compose logs --no-color --tail 150 backend
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans

  zeabur-template:
    name: Zeabur template validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install schema validation tools
        run: python3 -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Validate template and Mongo bootstrap
        run: python3 deploy/zeabur/check.py --mongo

  helm-chart:
    name: Helm chart validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint and validate rendered manifests
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar -xz -C /tmp linux-amd64/helm
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar -xz -C /tmp kubeconform
          /tmp/linux-amd64/helm lint deploy/helm/nuphos -f deploy/helm/ci-values.yaml --strict
          /tmp/linux-amd64/helm template nuphos deploy/helm/nuphos -f deploy/helm/ci-values.yaml | /tmp/kubeconform -strict -summary

  platform-templates:
    name: Railway template validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate Railway project specifications
        working-directory: deploy/railway
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          python3 smoke.py

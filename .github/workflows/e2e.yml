name: End-to-end

# The Desktop app driven against a real backend, MongoDB, file store and OpenAB, with a
# deterministic agent in place of a model: `bun run e2e`, the same command a
# contributor runs. Not a required check yet; see #2855.
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/backend/**'
      - 'apps/runtime/openab/**'
      - 'scripts/e2e/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop against a real backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Attested openab from openab-cache.yml on main; otherwise the next step compiles it.
      - id: openab
        uses: ./.github/actions/openab-binaries
      # Always staged: the app runs its own local agents from it. A cache hit reuses that openab.
      - name: Stage the local runtime
        working-directory: apps/desktop
        run: node local-runtime/prepare.mjs --targets linux-x64 --require
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd apps/backend && bun install --frozen-lockfile)
          (cd apps/desktop && pnpm install --frozen-lockfile)
      # The scenarios' 60 s wait for MongoDB must not include a cold image pull (#3102).
      # Keep the tags in step with MONGO_IMAGE in scripts/e2e/stack.ts and STORAGE_IMAGE in storage.ts.
      - name: Pull the MongoDB and file store images
        run: |
          docker pull mongo:8.0.32
          docker pull rustfs/rustfs:1.0.0
      - name: Run the end-to-end scenarios
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          xvfb-run --auto-servernum bun run e2e
      # Logs and a screenshot after each scenario; the database and the app's sign-in files are left out.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e
          path: |
            ${{ runner.temp }}/e2e
            !${{ runner.temp }}/e2e/mongo
            !${{ runner.temp }}/e2e/sign-in
          retention-days: 7

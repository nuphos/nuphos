{{- $name := printf "%s-backend" (include "nuphos.fullname" .) }}
{{- $secret := include "nuphos.secretName" . }}
{{- $storageUrl := include "nuphos.storageUrl" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "nuphos.labels" . | nindent 4 }}
    {{- include "nuphos.selectorLabels" (list . "backend") | nindent 4 }}
spec:
  selector:
    {{- include "nuphos.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "nuphos.labels" . | nindent 4 }}
    {{- include "nuphos.selectorLabels" (list . "backend") | nindent 4 }}
spec:
  # Without Redis the backend keeps its state in memory, so never run two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nuphos.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nuphos.labels" . | nindent 8 }}
        {{- include "nuphos.selectorLabels" (list . "backend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: MONGO_PASSWORD
            - name: MONGODB_URI
              value: mongodb://nuphos:$(MONGO_PASSWORD)@{{ include "nuphos.mongoHost" . }}:27017/nuphos?authSource=admin&replicaSet=rs0&directConnection=true
            - name: MONGODB_DB
              value: nuphos
            - name: NUPHOS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: NUPHOS_JWT_SECRET
            - name: NUPHOS_AUTH_BASE_URL
              value: {{ include "nuphos.backendUrl" . }}
            - name: NUPHOS_BACKEND_URL
              value: {{ include "nuphos.backendUrl" . }}
            - name: NUPHOS_PUBLIC_BACKEND_URL
              value: {{ include "nuphos.backendUrl" . }}
            - name: NUPHOS_EMAIL_PROVIDER
              value: {{ .Values.email.provider | lower }}
            - name: {{ include "nuphos.emailKeyName" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ include "nuphos.emailKeyName" . }}
            - name: NUPHOS_EMAIL_FROM
              value: {{ required "email.from is required" .Values.email.from | quote }}
            - name: ATLAS_REDIS_ENABLED
              value: 'false'
            - name: CLAUDE_CODE_RUNTIME_KUBECTL
              value: 'false'
            - name: CLAUDE_CODE_RUNTIME_PROVISIONER_ENABLED
              value: 'false'
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: STORAGE_SECRET_KEY
            - name: NUPHOS_FILE_TRANSFER_S3_BUCKET
              value: nuphos-file-transfers
            - name: NUPHOS_FILE_TRANSFER_S3_REGION
              value: us-east-1
            - name: NUPHOS_FILE_TRANSFER_S3_ENDPOINT
              value: {{ $storageUrl }}
            - name: NUPHOS_FILE_TRANSFER_S3_ACCESS_KEY_ID
              value: {{ .Values.storage.accessKey | quote }}
            - name: NUPHOS_FILE_TRANSFER_S3_SECRET_ACCESS_KEY
              value: $(STORAGE_SECRET_KEY)
            - name: ATLAS_SKILLS_BUCKET
              value: nuphos-skills
            - name: ATLAS_SKILLS_S3_REGION
              value: us-east-1
            - name: ATLAS_SKILLS_S3_ENDPOINT
              value: {{ $storageUrl }}
            - name: ATLAS_SKILLS_S3_ACCESS_KEY_ID
              value: {{ .Values.storage.accessKey | quote }}
            - name: ATLAS_SKILLS_S3_SECRET_ACCESS_KEY
              value: $(STORAGE_SECRET_KEY)
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

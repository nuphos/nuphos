{{- if not .Values.secrets.existingSecret }}
{{- $name := include "nuphos.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nuphos.labels" . | nindent 4 }}
  annotations:
    # Generated credentials must outlive an uninstall, or the volumes stop opening.
    helm.sh/resource-policy: keep
type: Opaque
data:
  NUPHOS_JWT_SECRET: {{ $s.jwtSecret | default (get $existing "NUPHOS_JWT_SECRET" | b64dec) | default (randAlphaNum 64) | b64enc }}
  MONGO_PASSWORD: {{ $s.mongoPassword | default (get $existing "MONGO_PASSWORD" | b64dec) | default (randAlphaNum 32) | b64enc }}
  STORAGE_SECRET_KEY: {{ $s.storageSecretKey | default (get $existing "STORAGE_SECRET_KEY" | b64dec) | default (randAlphaNum 32) | b64enc }}
  RUNTIME_AUTH_KEY: {{ $s.runtimeAuthKey | default (get $existing "RUNTIME_AUTH_KEY" | b64dec) | default (randAlphaNum 64) | b64enc }}
  {{- if eq (include "nuphos.emailKeyName" .) "ZSEND_API_KEY" }}
  ZSEND_API_KEY: {{ required "email.zsendApiKey is required" .Values.email.zsendApiKey | b64enc }}
  {{- else }}
  RESEND_API_KEY: {{ required "email.resendApiKey is required" .Values.email.resendApiKey | b64enc }}
  {{- end }}
{{- end }}

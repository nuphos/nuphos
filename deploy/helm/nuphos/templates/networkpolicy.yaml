{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nuphos.fullname" . }}-mongo
  labels:
    {{- include "nuphos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nuphos.selectorLabels" (list . "mongo") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "nuphos.selectorLabels" (list . "backend") | nindent 14 }}
        # rs.initiate dials the node's own pod address.
        - podSelector:
            matchLabels:
              {{- include "nuphos.selectorLabels" (list . "mongo") | nindent 14 }}
      ports:
        - port: 27017
{{- end }}

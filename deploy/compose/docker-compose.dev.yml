# `bun run dev` layers this on docker-compose.yml and starts only mongo, rustfs
# and runtime; the backend runs on the host with hot reload.
name: nuphos-dev

services:
  mongo:
    # Only mongo joins this network: `data` is internal and cannot publish ports.
    networks: [data, mongo-host]
    ports:
      - 127.0.0.1:${MONGO_PORT:-27117}:27017

  runtime:
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  mongo-host:

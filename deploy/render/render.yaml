# Backend data stack. Deploy runtime.yaml separately in a different region.
services:
  - name: nuphos-mongo
    type: pserv
    runtime: image
    region: oregon
    plan: 1c-2g
    numInstances: 1
    image:
      url: mongo:8.0.32
    disk:
      name: mongo-data
      mountPath: /data
      sizeGB: 10
    dockerCommand: |-
      /bin/bash -c '#!/bin/bash
      set -euo pipefail
      umask 077
      mkdir -p /data/configdb
      if [ ! -s /data/configdb/nuphos-keyfile ]; then
        head -c 48 /dev/urandom | base64 > /data/configdb/nuphos-keyfile
      fi
      chown mongodb:mongodb /data/configdb/nuphos-keyfile
      chmod 400 /data/configdb/nuphos-keyfile
      /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/nuphos-keyfile --bind_ip_all &
      pid=$!
      trap '"'"'kill -TERM "$pid"; wait "$pid"'"'"' TERM INT
      for attempt in $(seq 1 120); do
        kill -0 "$pid" || exit 1
        if mongosh '"'"'mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=2000'"'"' --quiet --eval '"'"'
          const admin = db.getSiblingDB("admin");
          if (!admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD)) quit(1);
          try { rs.status(); } catch (e) {
            if (e.code !== 94) throw e;
            rs.initiate({_id:"rs0",members:[{_id:0,host:process.env.NUPHOS_MONGO_HOST+":27017"}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
        '"'"' >/dev/null 2>&1; then
          wait "$pid"
          exit $?
        fi
        sleep 2
      done
      echo '"'"'Mongo replica set initialization timed out'"'"' >&2
      kill -TERM "$pid"
      wait "$pid"
      exit 1
      '
    envVars:
      - key: NUPHOS_MONGO_HOST
        value: localhost
      - key: MONGO_INITDB_ROOT_USERNAME
        value: nuphos
      - key: MONGO_INITDB_ROOT_PASSWORD
        generateValue: true
  - name: nuphos-storage
    type: web
    runtime: docker
    region: oregon
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./deploy/render/storage.Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    disk:
      name: storage-data
      mountPath: /data
      sizeGB: 10
    healthCheckPath: /health
    dockerCommand: |-
      /bin/sh -c '#!/bin/sh
      set -eu
      rm -f /tmp/buckets-ready
      /entrypoint.sh rustfs &
      pid=$!
      trap '"'"'kill -TERM $pid'"'"' TERM INT
      until curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; do
        kill -0 $pid 2>/dev/null || { echo "rustfs exited before becoming healthy" >&2; exit 1; }
        sleep 1
      done
      # /health answers before the S3 API does, so 5xx and refused connections are retried.
      for bucket in $BUCKETS; do
        waited=0
        while :; do
          status=$(curl -s -o /dev/null -w '"'"'%{http_code}'"'"' -X PUT \
            --aws-sigv4 '"'"'aws:amz:us-east-1:s3'"'"' --user "$S3_ACCESS_KEY:$S3_SECRET_KEY" \
            "$S3_ENDPOINT/$bucket" || true)
          case "$status" in
            200|409) echo "bucket $bucket ready"; break ;;
            000|5??)
              kill -0 $pid 2>/dev/null || { echo "rustfs exited while creating buckets" >&2; exit 1; }
              if [ "$waited" -ge 60 ]; then
                echo "bucket $bucket: HTTP $status after ${waited}s" >&2; kill -TERM $pid; exit 1
              fi
              delay=$((waited < 8 ? 1 : 4))
              sleep "$delay"
              waited=$((waited + delay)) ;;
            *) echo "bucket $bucket: HTTP $status" >&2; kill -TERM $pid; exit 1 ;;
          esac
        done
      done
      touch /tmp/buckets-ready
      wait $pid
      '
    envVars:
      - key: PORT
        value: '9000'
      - key: RUSTFS_ADDRESS
        value: 0.0.0.0:9000
      - key: RUSTFS_ACCESS_KEY
        value: nuphos
      - key: RUSTFS_SECRET_KEY
        generateValue: true
      - key: S3_ACCESS_KEY
        value: nuphos
      - key: S3_SECRET_KEY
        fromService:
          name: nuphos-storage
          type: web
          envVarKey: RUSTFS_SECRET_KEY
      - key: S3_ENDPOINT
        value: http://127.0.0.1:9000
      - key: BUCKETS
        value: nuphos-file-transfers nuphos-skills
  - name: nuphos-backend
    type: web
    runtime: docker
    region: oregon
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./deploy/render/backend.Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: MONGO_HOST
        fromService:
          name: nuphos-mongo
          type: pserv
          property: host
      - key: MONGO_PASSWORD
        fromService:
          name: nuphos-mongo
          type: pserv
          envVarKey: MONGO_INITDB_ROOT_PASSWORD
      - key: STORAGE_HOST
        fromService:
          name: nuphos-storage
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: NUPHOS_JWT_SECRET
        generateValue: true
      - key: ZSEND_API_KEY
        sync: false
      - key: NUPHOS_EMAIL_FROM
        sync: false
      - key: MONGODB_DB
        value: nuphos
      - key: ATLAS_REDIS_ENABLED
        value: 'false'
      - key: BRAINTRUST_TRACING_ENABLED
        value: 'false'
      - key: CLAUDE_CODE_RUNTIME_KUBECTL
        value: 'false'
      - key: CLAUDE_CODE_RUNTIME_PROVISIONER_ENABLED
        value: 'false'
      - key: NUPHOS_FILE_TRANSFER_S3_BUCKET
        value: nuphos-file-transfers
      - key: NUPHOS_FILE_TRANSFER_S3_REGION
        value: us-east-1
      - key: ATLAS_SKILLS_BUCKET
        value: nuphos-skills
      - key: ATLAS_SKILLS_S3_REGION
        value: us-east-1
      - key: NUPHOS_FILE_TRANSFER_S3_SECRET_ACCESS_KEY
        fromService:
          name: nuphos-storage
          type: web
          envVarKey: RUSTFS_SECRET_KEY
      - key: ATLAS_SKILLS_S3_SECRET_ACCESS_KEY
        fromService:
          name: nuphos-storage
          type: web
          envVarKey: RUSTFS_SECRET_KEY
      - key: NUPHOS_FILE_TRANSFER_S3_ACCESS_KEY_ID
        value: nuphos
      - key: ATLAS_SKILLS_S3_ACCESS_KEY_ID
        value: nuphos
